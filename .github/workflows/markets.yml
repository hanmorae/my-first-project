name: 환율·지수 업데이트

on:
  schedule:
    - cron: "7 * * * *" # 매시간 7분 (GitHub 사정에 따라 조금 늦어질 수 있음)
  workflow_dispatch: # Actions 탭에서 수동 실행 가능
  push:
    branches: [main]
    paths:
      - scripts/fetch-markets.mjs
      - .github/workflows/markets.yml

permissions:
  contents: write

concurrency:
  group: markets
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-markets.mjs
      - name: 변경 사항 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "환율·지수 데이터 업데이트"
            git pull --rebase
            git push
          fi
